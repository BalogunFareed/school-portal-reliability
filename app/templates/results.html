<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Results Portal</title>
</head>
<body>
    <h1>University Student Portal</h1>

    <p>Welcome to the student results portal.</p>

    <h2>Check Your Results</h2>

    <form method="POST" action="/">
        <label for="student_id">Student ID:</label>

        <input
            type="text"
            id="student_id"
            name="student_id"
            placeholder="Enter your student ID"
            required
        >

        <button type="submit">Check Results</button>
    </form>
</body>
</html>
